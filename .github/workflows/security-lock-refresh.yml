name: Temporary security lock refresh

on:
  push:
    branches:
      - security/dependabot-remediation-2026-09-14

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh lockfile safely
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify dependency advisories
        run: npm audit --audit-level=low
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: refresh lockfile for security advisories"
            git push
          fi
